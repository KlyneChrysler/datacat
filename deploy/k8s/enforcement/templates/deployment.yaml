apiVersion: apps/v1
kind: Deployment
metadata:
  name: enforcement
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: { app: enforcement }
  template:
    metadata:
      labels: { app: enforcement }
    spec:
      serviceAccountName: enforcement
      securityContext:
        runAsNonRoot: true
        # distroless :nonroot declares its user by name; kubelet needs the
        # numeric UID to verify runAsNonRoot.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: enforcement
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          envFrom:
            - configMapRef: { name: enforcement-config }
            - secretRef: { name: enforcement-secrets, optional: true }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources: {{ .Values.resources | toYaml | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      terminationGracePeriodSeconds: 30
