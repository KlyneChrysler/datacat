# replicas may exceed 1 ONLY when env sets DECISIONS_TABLE (DynamoDB
# store). With the default in-memory store, two replicas would each hold
# half the decisions behind one Service.
replicas: 1

image:
  repository: datacat/enforcement
  tag: dev
  pullPolicy: Never

env:
  PORT: "8081"
  KAFKA_BROKERS: redpanda:9092
  VERDICTS_TOPIC: datacat.verdicts
  DECISIONS_TOPIC: datacat.decisions
  CONSUMER_GROUP: enforcement
  LOG_LEVEL: info

port: 8081

resources:
  requests: { cpu: 100m, memory: 64Mi }
  limits: { memory: 128Mi }
