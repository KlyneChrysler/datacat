# Local development stack (twelve-factor X: dev/prod parity). Same images and
# env-var contract as EKS; only the values differ. Usage: docker compose up
services:
  # The protected demo application traffic flows to.
  whoami:
    image: traefik/whoami:latest
    ports:
      - "8090:80"

  edge-proxy:
    build:
      context: .
      dockerfile: services/edge-proxy/Dockerfile
    environment:
      PORT: "8080"
      UPSTREAM_URL: http://whoami:80
      KAFKA_BROKERS: redpanda:9092
      REQUESTS_TOPIC: datacat.requests
      DECISIONS_TOPIC: datacat.decisions
      DECISIONS_GROUP: edge-proxy
      LOG_LEVEL: info
    ports:
      - "8080:8080"
    depends_on:
      - whoami
      - redpanda

  enforcement:
    build:
      context: .
      dockerfile: services/enforcement/Dockerfile
    environment:
      PORT: "8081"
      KAFKA_BROKERS: redpanda:9092
      VERDICTS_TOPIC: datacat.verdicts
      DECISIONS_TOPIC: datacat.decisions
      CONSUMER_GROUP: enforcement
      LOG_LEVEL: info
      # Uncomment to switch the decision store from in-memory to DynamoDB
      # Local (create the table first: infra/terraform/envs/local apply).
      # DECISIONS_TABLE: local-datacat-decisions
      # DYNAMO_ENDPOINT: http://dynamodb:8000
      # AWS_ACCESS_KEY_ID: local
      # AWS_SECRET_ACCESS_KEY: local
      # AWS_REGION: us-east-1
    ports:
      - "8081:8081"
    depends_on:
      - redpanda

  # Opt-in demo load: docker compose --profile demo up traffic-sim
  traffic-sim:
    build:
      context: .
      dockerfile: services/traffic-sim/Dockerfile
    profiles: ["demo"]
    environment:
      TARGET_URL: http://edge-proxy:8080
      LOG_LEVEL: info
    depends_on:
      - edge-proxy

  redpanda:
    image: redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"

  # One-off admin process (twelve-factor XII): topics are provisioned
  # explicitly, never auto-created.
  topic-init:
    image: redpandadata/redpanda:latest
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "rpk topic create datacat.requests datacat.verdicts datacat.decisions -p 3 -X brokers=redpanda:9092 || true"
    depends_on:
      - redpanda

  redpanda-console:
    image: redpandadata/console:latest
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8085:8080"
    depends_on:
      - redpanda

  dynamodb:
    image: amazon/dynamodb-local:latest
    ports:
      - "8000:8000"

  # NOTE: LocalStack was removed - it now requires an auth token even for
  # community usage. DynamoDB Local (above) covers the local Terraform env;
  # S3/Lambda/Step Functions are exercised against real AWS in staging.

  # Keep this tag in sync with flinkVersion in services/classifier-job/build.gradle.kts
  # The classifier env is read by `flink run` at submission (JobConfig.fromEnv).
  # Local windows are short for fast feedback; staging/prod use the defaults.
  flink-jobmanager:
    image: flink:2.2.1-java17
    command: jobmanager
    environment:
      KAFKA_BROKERS: redpanda:9092
      REQUESTS_TOPIC: datacat.requests
      VERDICTS_TOPIC: datacat.verdicts
      CHECKPOINT_URI: file:///tmp/flink-checkpoints
      WINDOW_SECONDS: "60"
      SLIDE_SECONDS: "10"
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
    ports:
      - "8086:8081"
    depends_on:
      - redpanda

  flink-taskmanager:
    image: flink:2.2.1-java17
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
    depends_on:
      - flink-jobmanager
