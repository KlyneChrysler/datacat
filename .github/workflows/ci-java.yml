name: ci-java

on:
  push:
    branches: [main]
    paths: ["services/policy-service/**", "services/classifier-job/**", ".github/workflows/ci-java.yml"]
  pull_request:
    paths: ["services/policy-service/**", "services/classifier-job/**", ".github/workflows/ci-java.yml"]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [policy-service, classifier-job]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21" # Gradle runtime; project toolchains auto-provision via foojay
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test --console=plain
